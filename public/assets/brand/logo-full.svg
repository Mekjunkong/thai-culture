<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Thai Lessons Chiang Mai — Doi Suthep Lanna logo</title>
  <desc id="desc">A premium emblem combining the Doi Suthep ridgeline with a simplified Lanna chedi and open doorway.</desc>
  <rect width="980" height="300" fill="#F5F0E7"/>
  <g transform="translate(36 34)">
    <!-- Doi Suthep ridgeline -->
    <path d="M0 205C46 191 77 166 112 117c17-24 29-49 39-76 10 28 23 53 41 76 36 47 68 72 116 88v20H0Z" fill="#1F2923"/>
    <!-- Lanna chedi / gateway -->
    <path d="M151 38 169 77 151 96 133 77Z" fill="#B18A43"/>
    <path d="M151 86 139 111h24Z" fill="#B18A43"/>
    <path d="M128 112h46v13h-46zM121 125h60v16h-60zM111 141h80v18h-80zM99 159h104v20H99zM89 179h124v22H89z" fill="#B18A43"/>
    <path d="M75 201h152l-20 18H95Z" fill="#B18A43"/>
    <!-- open passage -->
    <path d="M131 201h40v70h-40Z" fill="#B18A43"/>
    <path d="M139 271v-38c0-9 5-14 12-14s12 5 12 14v38Z" fill="#F5F0E7"/>
    <!-- fine Lanna-like accent -->
    <path d="M95 112c16-16 36-24 56-24s40 8 56 24" fill="none" stroke="#F5F0E7" stroke-width="4"/>
  </g>
  <g transform="translate(345 77)">
    <text x="0" y="25" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="6" fill="#B18A43">CHIANG MAI</text>
    <text x="0" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1F2923" letter-spacing="-2.3">Thai Lessons</text>
    <path d="M2 119h488" stroke="#D5C9B7" stroke-width="2"/>
    <text x="0" y="155" font-family="'Noto Sans Tai Tham', 'Tai Tham', sans-serif" font-size="24" fill="#1F2923">ᨲ᩠ᩅᩫᨾᩮᩥᩬᨦ</text>
    <text x="156" y="153" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3.1" fill="#6F6B61">TUA MUEANG · LANGUAGE IN PLACE</text>
  </g>
</svg>
